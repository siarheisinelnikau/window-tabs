[package]
name = "window-tabs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Native tab groups for ordinary Windows application windows"
repository = "https://github.com/siarheisinelnikau/window-tabs"
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.18.1"
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Networking_WinHttp", "Win32_System_Console"
] }

[profile.release]
strip = "debuginfo"

[[bin]]
name = "WindowTabs"
path = "src/main.rs"

