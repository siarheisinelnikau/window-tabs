name: Build and synthetic tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the local shared updater prerequisite
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath ../rust-auto-updator/crates/rust-auto-updator/Cargo.toml)) {
            throw 'Provision rust-auto-updator beside this repository before verification. The shared crate is currently a local dependency; no remote source has been published.'
          }
      - name: Verify formatting, isolated tests, and Clippy
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Build and inspect standalone x64 package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WindowTabs-windows-x64
          path: dist/v*/
          if-no-files-found: error

